[project]
name = "sse-ssi-pmo"
version = "0.1.0"
description = "Probability of major outbreak under SSE, SSI, and Poisson branching-process models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pymc>=5.0",
    "arviz>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sse_ssi_pmo"]

# ---------------------------------------------------------------------------
# pixi configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
pymc = ">=5.0"
arviz = ">=1"

[tool.pixi.pypi-dependencies]
sse-ssi-pmo = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
ruff = "*"
ty = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
lint = "ruff check src analysis"
fmt = "ruff format src analysis"
typecheck = "env -u VIRTUAL_ENV ty check src analysis"

# --- base paper: infection-anchored PMO (figures 1-12) ---
base-res1 = "python -m analysis.base.results_1_pmo_vs_r"
base-res2 = "python -m analysis.base.results_2_pmo_vs_R0"
base-res3 = "python -m analysis.base.results_3_pmo_vs_k"
base-res4 = "python -m analysis.base.results_4_pmo_comparison"
base-res5 = "python -m analysis.base.results_5_pmo_uncertain"
base-res6 = "python -m analysis.base.results_6_pmo_error"
base-res7 = "python -m analysis.base.results_7_pmo_ensemble_error"
base-res8 = "python -m analysis.base.results_8_pmo_uncertain_R0"
base-res9 = "python -m analysis.base.results_9_pmo_uncertain_combined"
base-res10 = "python -m analysis.base.results_10_pmo_error_uncertain_R0"
base-results = { depends-on = ["base-res1", "base-res2", "base-res3", "base-res4", "base-res5", "base-res6", "base-res7", "base-res8", "base-res9", "base-res10"] }
base-fig1 = "python -m analysis.base.figure_1_pmo_vs_r"
base-fig2 = "python -m analysis.base.figure_2_pmo_vs_R0"
base-fig3 = "python -m analysis.base.figure_3_pmo_vs_k"
base-fig4 = "python -m analysis.base.figure_4_pmo_comparison"
base-fig5 = "python -m analysis.base.figure_5_pmo_uncertain"
base-fig6 = "python -m analysis.base.figure_6_pmo_error"
base-fig7 = "python -m analysis.base.figure_7_pmo_ensemble_error"
base-fig8 = "python -m analysis.base.figure_8_pmo_uncertain_R0"
base-fig9 = "python -m analysis.base.figure_9_pmo_uncertain_combined"
base-fig10 = "python -m analysis.base.figure_10_pmo_error_uncertain_R0"
base-figs = { depends-on = ["base-fig1", "base-fig2", "base-fig3", "base-fig4", "base-fig5", "base-fig6", "base-fig7", "base-fig8", "base-fig9", "base-fig10"] }

# --- delays paper: symptom-onset-anchored models (figures 1-6) ---
delays-res1 = "python -m analysis.delays.results_1_pmo_vs_r_delay"
delays-res2 = "python -m analysis.delays.results_2_pmo_comparison_delay"
delays-res3 = "python -m analysis.delays.results_3_pmo_realtime_sim"
delays-res4 = "python -m analysis.delays.results_4_pmo_realtime_likati"
delays-res5 = "python -m analysis.delays.results_5_pmo_realtime_equateur2018"
delays-res6 = "python -m analysis.delays.results_6_pmo_realtime_equateur2020"
delays-results = { depends-on = ["delays-res1", "delays-res2", "delays-res3", "delays-res4", "delays-res5", "delays-res6"] }
delays-fig1 = "python -m analysis.delays.figure_1_pmo_vs_r_delay"
delays-fig2 = "python -m analysis.delays.figure_2_pmo_comparison_delay"
delays-fig3 = "python -m analysis.delays.figure_3_pmo_realtime_sim"
delays-fig4 = "python -m analysis.delays.figure_4_pmo_realtime_likati"
delays-fig5 = "python -m analysis.delays.figure_5_pmo_realtime_equateur2018"
delays-fig6 = "python -m analysis.delays.figure_6_pmo_realtime_equateur2020"
delays-figs = { depends-on = ["delays-fig1", "delays-fig2", "delays-fig3", "delays-fig4", "delays-fig5", "delays-fig6"] }

# --- aggregates across both papers ---
results = { depends-on = ["base-results", "delays-results"] }
figs = { depends-on = ["base-figs", "delays-figs"] }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N802/N803/N806: lower_case function / argument / variable names. R0,
# F_r, k, Y, _log_lik_given_Y, _broadcast_R0_k follow the mathematical
# notation in notes.tex, so we keep the capitalisation. N999: module
# filenames such as figure_2_pmo_vs_R0.py keep the same R0 capitalisation.
ignore = ["N802", "N803", "N806", "N999"]
