[project]
name = "sse-ssi-pmo"
version = "0.1.0"
description = "Probability of major outbreak under SSE, SSI, and Poisson branching-process models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pymc>=5.0",
    "arviz>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sse_ssi_pmo"]

# ---------------------------------------------------------------------------
# pixi configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
pymc = ">=5.0"
arviz = ">=1"

[tool.pixi.pypi-dependencies]
sse-ssi-pmo = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
ruff = "*"
ty = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
lint = "ruff check src analysis"
fmt = "ruff format src analysis"
typecheck = "env -u VIRTUAL_ENV ty check src analysis"
res1 = "python analysis/results_1_pmo_vs_r.py"
res2 = "python analysis/results_2_pmo_vs_R0.py"
res3 = "python analysis/results_3_pmo_vs_k.py"
res4 = "python analysis/results_4_pmo_comparison.py"
res5 = "python analysis/results_5_pmo_uncertain.py"
res6 = "python analysis/results_6_pmo_error.py"
res7 = "python analysis/results_7_pmo_ensemble_error.py"
res8 = "python analysis/results_8_pmo_uncertain_R0.py"
res9 = "python analysis/results_9_pmo_uncertain_combined.py"
res10 = "python analysis/results_10_pmo_error_uncertain_R0.py"
res11 = "python analysis/results_11_pmo_vs_r_delay.py"
res12 = "python analysis/results_12_pmo_comparison_delay.py"
res13 = "python analysis/results_13_pmo_realtime_sim.py"
res14 = "python analysis/results_14_pmo_realtime_likati.py"
res15 = "python analysis/results_15_pmo_realtime_equateur.py"
res16 = "python analysis/results_16_pmo_realtime_equateur2018.py"
results = { depends-on = ["res1", "res2", "res3", "res4", "res5", "res6", "res7", "res8", "res9", "res10", "res11", "res12", "res13", "res14", "res15", "res16"] }
fig1 = "python analysis/figure_1_pmo_vs_r.py"
fig2 = "python analysis/figure_2_pmo_vs_R0.py"
fig3 = "python analysis/figure_3_pmo_vs_k.py"
fig4 = "python analysis/figure_4_pmo_comparison.py"
fig5 = "python analysis/figure_5_pmo_uncertain.py"
fig6 = "python analysis/figure_6_pmo_error.py"
fig7 = "python analysis/figure_7_pmo_ensemble_error.py"
fig8 = "python analysis/figure_8_pmo_uncertain_R0.py"
fig9 = "python analysis/figure_9_pmo_uncertain_combined.py"
fig10 = "python analysis/figure_10_pmo_error_uncertain_R0.py"
fig11 = "python analysis/figure_11_pmo_vs_r_delay.py"
fig12 = "python analysis/figure_12_pmo_comparison_delay.py"
fig13 = "python analysis/figure_13_pmo_realtime_sim.py"
fig14 = "python analysis/figure_14_pmo_realtime_likati.py"
fig15 = "python analysis/figure_15_pmo_realtime_equateur.py"
fig16 = "python analysis/figure_16_pmo_realtime_equateur2018.py"
figs = { depends-on = ["fig1", "fig2", "fig3", "fig4", "fig5", "fig6", "fig7", "fig8", "fig9", "fig10", "fig11", "fig12", "fig13", "fig14", "fig15", "fig16"] }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N802/N803/N806: lower_case function / argument / variable names. R0,
# F_r, k, Y, _log_lik_given_Y, _broadcast_R0_k follow the mathematical
# notation in notes.tex, so we keep the capitalisation.
ignore = ["N802", "N803", "N806"]
