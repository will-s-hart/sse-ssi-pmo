[project]
name = "sse-ssi-pmo"
version = "0.1.0"
description = "Probability of major outbreak under SSE and SSI branching-process models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pymc>=5.0",
    "arviz>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sse_ssi_pmo"]

# ---------------------------------------------------------------------------
# pixi configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
pymc = ">=5.0"
arviz = ">=0.19"

[tool.pixi.pypi-dependencies]
sse-ssi-pmo = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
ruff = "*"
ty = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
lint = "ruff check src analysis"
fmt = "ruff format src analysis"
typecheck = "env -u VIRTUAL_ENV ty check src analysis"
res1 = "python analysis/results_1_pmo_vs_r.py"
res2 = "python analysis/results_2_pmo_vs_R0.py"
res3 = "python analysis/results_3_pmo_vs_k.py"
res4 = "python analysis/results_4_pmo_comparison.py"
res5 = "python analysis/results_5_pmo_uncertain.py"
res6 = "python analysis/results_6_pmo_error.py"
results = { depends-on = ["res1", "res2", "res3", "res4", "res5", "res6"] }
fig1 = "python analysis/figure_1_pmo_vs_r.py"
fig2 = "python analysis/figure_2_pmo_vs_R0.py"
fig3 = "python analysis/figure_3_pmo_vs_k.py"
fig4 = "python analysis/figure_4_pmo_comparison.py"
fig5 = "python analysis/figure_5_pmo_uncertain.py"
fig6 = "python analysis/figure_6_pmo_error.py"
figs = { depends-on = ["fig1", "fig2", "fig3", "fig4", "fig5", "fig6"] }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N802/N803/N806: lower_case function / argument / variable names. R0,
# F_r, k, Y, _log_lik_given_Y, _broadcast_R0_k follow the mathematical
# notation in notes.tex, so we keep the capitalisation.
ignore = ["N802", "N803", "N806"]
